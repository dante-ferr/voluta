# Kitty Terminal Configuration - Imperium Cyber-Sacred Rice
# Featuring Monaspace Argon humanist typography, dynamic Wallust palette, and Roman powerline tab styling

# Typography & Fonts
font_family      family="Monaspace Argon" style="Regular"
bold_font        family="Monaspace Argon" style="Bold"
italic_font      family="Monaspace Argon" style="Italic"
bold_italic_font family="Monaspace Argon" style="Bold Italic"
font_size        12.5

# Font Features & Ligatures
disable_ligatures cursor

# Monaspace's default leading is tight (1.245em); open it up so long scrollback
# stays comfortable to read.
modify_font cell_height 108%

# Monaspace ships no icons: pin every Nerd Font range to one font so the
# starship powerline caps keep consistent metrics instead of falling back
# to whatever fontconfig picks per codepoint.
symbol_map U+E000-U+E00A,U+EA60-U+EBEB,U+E0A0-U+E0C8,U+E0CA,U+E0CC-U+E0D7 JetBrainsMono Nerd Font Mono
symbol_map U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF JetBrainsMono Nerd Font Mono
symbol_map U+ED00-U+F2FF,U+F000-U+F2E0,U+F300-U+F381,U+F400-U+F533 JetBrainsMono Nerd Font Mono
symbol_map U+F0001-U+F1AF0 JetBrainsMono Nerd Font Mono

# Window Appearance & Layout (Sharp Corners)
window_padding_width        14 18
window_margin_width         0
single_window_margin_width  0
window_border_width         1.5pt
draw_minimal_borders        yes
background_opacity          0.92
dynamic_background_opacity  yes
confirm_os_window_close     0
linux_display_server        auto
hide_window_decorations     yes

# Terminal Decorations & Roman Powerline Tab Bar
tab_bar_edge                top
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_min_tabs            1
tab_bar_align               left
tab_title_template          " ✠ {index} │ {fmt.bold}{title}{fmt.nobold} "
active_tab_title_template   " 🏛 {index} │ {fmt.bold}{title}{fmt.nobold} ☩ "
active_tab_font_style       bold-italic
inactive_tab_font_style     normal

# Cursor & Cybernetic Particle Trail
cursor_shape                block
cursor_blink_interval       0.4
cursor_trail                3
cursor_trail_decay          0.08 0.30
cursor_trail_start_threshold 2

# Scrollback & Mouse
scrollback_lines            10000
wheel_scroll_min_lines      1
mouse_hide_wait             3.0

# Bell & URL Styling
enable_audio_bell           no
visual_bell_duration        0.0
url_style                   curly
open_url_with               default
detect_urls                 yes

# Layouts & Splits
enabled_layouts             tall:bias=55;full_size=1;stack,fat,grid,splits,stack

# Keybindings for Split Windows and Tabs
map ctrl+shift+enter        new_window_with_cwd
map ctrl+shift+t            new_tab_with_cwd
map ctrl+shift+w            close_window
map ctrl+shift+]            next_window
map ctrl+shift+[            previous_window
map ctrl+shift+l            next_layout

# Remote Control & IPC Socket
allow_remote_control        yes
listen_on                   unix:/tmp/kitty

# Dynamic Wallust Theme (Colors, Tabs, Borders, Cursor, & ANSI Palette)
include ./kitty-themes/01-Wallust.conf
