# wallust configuration - for wallust version 4.0

# How the image is parsed, in order to get the colors:
# full - resized - wal - thumb - fastresize
# thumb is the fastest (fixed 512×512). fastresize is SIMD and the v4 default.
backend = "thumb"

# NOTE: Wallust v4 uses palette, style, and tuning to configure color generation.
# Palette generation method: salience (prominent colors), ansi (tty layout), or kmeans (centroids)
palette = "salience"

# Theme style: dark or light
style = "dark"

# Tuning options for salience palette
# sampling: high, balanced, distributed, low
# intensity: normal, pastel, vibrant
salience = { sampling = "balanced", intensity = "pastel" }

# Color saturation adjustment (1 - 100). Higher values make colors brighter and more vibrant.
saturation = 20

# Contrast search is off by default. Do not enable it: wallust re-walks the
# palette until contrast passes, which made wallpaper changes feel multi-second.
#check_contrast = true

# Difference between similar colors (1 - 100), used inside the colorspace.
# Higher threshold creates more distinct colors (more contrast between them).
threshold = 11

[templates]
cava.template = 'colors-cava'
cava.target = '~/.config/cava/config'

hypr.template = 'colors-hyprland.conf'
hypr.target = '~/.config/hypr/wallust/wallust-hyprland.conf'

rofi.template = 'colors-rofi.rasi'
rofi.target = '~/.config/rofi/wallust/colors-rofi.rasi'

waybar.template = 'colors-waybar.css'
waybar.target = '~/.config/waybar/wallust/colors-waybar.css'

kitty.template = 'colors-kitty.conf'
kitty.target = '~/.config/kitty/kitty-themes/01-Wallust.conf'

# starship.toml is linked from the rice and has no wallust placeholders.
# Rendering it on every wallpaper change was a no-op rewrite of a large file.

quickshell.template = 'qml_color.json'
quickshell.target = '~/.config/quickshell/qml_color.json'

shell.template = 'colors-shell.sh'
shell.target = '~/.config/hypr/wallust/colors-shell.sh'

swaync.template = 'colors-swaync.css'
swaync.target = '~/.config/swaync/wallust/colors-swaync.css'

wlogout.template = 'colors-wlogout.css'
wlogout.target = '~/.config/wlogout/wallust/colors-wlogout.css'

#macchina.template = 'colors-macchina.toml'
#macchina.target = '~/.config/macchina/themes/wallust.toml'

#wezterm.template = 'colors-wezterm.toml'
#wezterm.target = '~/.config/wezterm/colors/wallust.toml'

#zathura.template = 'colors-zathura'
#zathura.target = '~/.config/zathura/zathurarc'

# Mirrored notification corners are recolored alongside the SwayNC stylesheet.

[templates.notification_corner_tl]
template = "../assets/corner-tl.svg"
target = "~/.config/wallust/assets/generated/corner-tl.svg"

[templates.notification_corner_tr]
template = "../assets/corner-tr.svg"
target = "~/.config/wallust/assets/generated/corner-tr.svg"

[templates.notification_corner_bl]
template = "../assets/corner-bl.svg"
target = "~/.config/wallust/assets/generated/corner-bl.svg"

[templates.notification_corner_br]
template = "../assets/corner-br.svg"
target = "~/.config/wallust/assets/generated/corner-br.svg"
