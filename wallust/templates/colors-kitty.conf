# /* wallust template - colors-kitty */
#
# Same contrast lift as colors-waybar / colors-swaync: raw wallust hues from a
# dark low-contrast wallpaper crush ANSI text and TUI chrome against the
# near-black terminal surface. Lift foreground and accents the way the bar
# does, and keep color0 a step above the background so box plates stay visible.

foreground         {{foreground | lighten(0.30)}}
background         {{background | darken(0.35)}}
cursor             {{cursor | lighten(0.30)}}
cursor_text_color  {{background | darken(0.35)}}

url_color          {{color4 | lighten(0.30)}}

# Text and ornaments carry the emphasis; tabs share the terminal surface.
active_tab_foreground     {{color15 | lighten(0.35)}}
active_tab_background     {{background | darken(0.35)}}
inactive_tab_foreground   {{color8 | lighten(0.18)}}
inactive_tab_background   {{background | darken(0.35)}}
tab_bar_background        {{background | darken(0.35)}}
tab_bar_margin_color      {{background | darken(0.35)}}

active_border_color   {{color1 | lighten(0.30)}}
inactive_border_color {{color0 | lighten(0.14)}}
bell_border_color     {{color1 | lighten(0.30)}}

selection_background  {{color0 | lighten(0.22)}}
selection_foreground  {{foreground | lighten(0.30)}}

color0             {{color0 | lighten(0.14)}}
color1             {{color1 | lighten(0.30)}}
color2             {{color2 | lighten(0.30)}}
color3             {{color3 | lighten(0.30)}}
color4             {{color4 | lighten(0.30)}}
color5             {{color5 | lighten(0.30)}}
color6             {{color6 | lighten(0.30)}}
color7             {{color7 | lighten(0.30)}}

color8             {{color8 | lighten(0.18)}}
color9             {{color9 | lighten(0.35)}}
color10            {{color10 | lighten(0.35)}}
color11            {{color11 | lighten(0.35)}}
color12            {{color12 | lighten(0.35)}}
color13            {{color13 | lighten(0.35)}}
color14            {{color14 | lighten(0.35)}}
color15            {{color15 | lighten(0.35)}}
