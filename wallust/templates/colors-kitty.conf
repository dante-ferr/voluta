# /* wallust template - colors-kitty */
#
# Wallust's raw background sits at near-pure black on most wallpapers, which
# crushes the ANSI blacks against it. Lift the terminal surfaces a couple of
# steps so the palette keeps its hue but the chrome stays legible. The lift is
# kept small because kitty blends this background with the wallpaper behind it.

foreground         {{foreground}}
background         {{background | lighten(0.03)}}
cursor             {{cursor}}
cursor_text_color  {{background | lighten(0.03)}}

url_color          {{color4}}

active_tab_foreground     {{background | lighten(0.03)}}
active_tab_background     {{color1}}
inactive_tab_foreground   {{color15}}
inactive_tab_background   {{color0 | lighten(0.11)}}
tab_bar_background        {{background | lighten(0.03)}}
tab_bar_margin_color      {{background | lighten(0.03)}}

active_border_color   {{color1}}
inactive_border_color {{color0 | lighten(0.11)}}
bell_border_color     {{color1}}

selection_background  {{color0 | lighten(0.18)}}
selection_foreground  {{foreground}}

color0             {{color0 | lighten(0.11)}}
color1             {{color1}}
color2             {{color2}}
color3             {{color3}}
color4             {{color4}}
color5             {{color5}}
color6             {{color6}}
color7             {{color7}}

color8             {{color8}}
color9             {{color9}}
color10            {{color10}}
color11            {{color11}}
color12            {{color12}}
color13            {{color13}}
color14            {{color14}}
color15            {{color15}}
