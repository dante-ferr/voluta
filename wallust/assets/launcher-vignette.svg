<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <!-- Uniform veil. Hyprland only blurs pixels that have opacity, so this
       rect is the fullscreen frost. Keep a single opacity: a feathered
       center reads as a vignette. Dark glass inside the frames is separate. -->
  <rect width="2560" height="1440" fill="{{background}}" fill-opacity="0.06"/>
</svg>
