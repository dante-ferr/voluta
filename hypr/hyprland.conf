# Hyprland Config - Imperium Cyber-Sacred Rice
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserConfigs = $HOME/.config/hypr/UserConfigs
$UserScripts = $HOME/.config/hypr/UserScripts

# Monitors and Workspaces
source = $HOME/.config/hypr/monitors.conf
source = $HOME/.config/hypr/workspaces.conf

# Source dynamic Wallust generated colors if present
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

# Source User and System Settings & Keybinds
source = $HOME/.config/hypr/UserConfigs/UserSettings.conf
source = $HOME/.config/hypr/UserConfigs/UserKeybinds.conf
source = $HOME/.config/hypr/configs/Keybinds.conf
