$UserScripts = $HOME/.config/hypr/UserScripts

# Custom User Keybinds
unbind = Ctrl+Shift, C

# --- Apps and utils
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf

# Apps
unbind = Super, B
bind = Super, B, exec, floorp

unbind = Super, W
bind = Super, W, exec, waypaper

unbind = Super, T

# Display modes
bind = Super, F1, exec, nwg-displays-apply -p Horizontal
bind = Super, F2, exec, nwg-displays-apply -p Vertical
bind = Super, F3, exec, nwg-displays-apply -p Notebook

# Default file explorer
unbind = Super, E
bind = Super, E, exec, nautilus

unbind = Super, S

# App launcher & System HUD
unbind = $mainMod, D
bindd = $mainMod CTRL, Return, command deck, exec, $UserScripts/command_deck.sh
bind = SUPER, I, exec, $UserScripts/system_hud.sh
bind = SUPER CTRL, T, exec, $UserScripts/system_hud.sh
bind = SUPER SHIFT, M, exec, kitty --class system-monitor -e btop

# Command Deck panels: pinned wings flanking the centred app launcher.
# Sized off monitor_w/monitor_h so the deck lays out the same on every output.
windowrule {
    name = imperium-deck-sigil
    match:class = ^(imperium-sigil)$

    float = on
    size = (monitor_w*0.23) (monitor_h*0.62)
    move = (monitor_w*0.04) (monitor_h*0.19)
    pin = on
    no_initial_focus = on
    rounding = 0
    border_color = $color12 $color4
    animation = popin
}

windowrule {
    name = imperium-deck-telemetry
    match:class = ^(imperium-telemetry)$

    float = on
    size = (monitor_w*0.25) (monitor_h*0.62)
    move = (monitor_w*0.71) (monitor_h*0.19)
    pin = on
    no_initial_focus = on
    rounding = 0
    border_color = $color12 $color4
    animation = popin
}

# Modified night light toggle
unbind = Super, N
bindd = $mainMod, N, toggle night light, exec, $UserScripts/Hyprsunset.sh toggle

# Obs studio recording
bind = $mainMod, KP_Add, exec, bash -c 'obs-cmd recording toggle && notify-send "OBS Studio" "Recording Toggled"'

# Pixel Widget
unbind = Super, G
bind = $mainMod, G, exec, $UserScripts/pixel-widget.sh

windowrule {
    name = widget-pixel-art
    match:title = ^(pixel-art-widget)$
    float = on
    move = cursor -50% -50%
    pin = on
    opacity = 1.0 override 1.0 override
}
