# /* Hypridle configuration */
# Manages system idle timeouts, screen lock, display power management, and sleep hooks

general {
    lock_cmd = pidof hyprlock || hyprlock       # runs hyprlock if not already running
    before_sleep_cmd = loginctl lock-session     # lock session before sleep
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after sleep
    ignore_dbus_inhibit = false                 # allow media/browsers to inhibit idle if needed
}

# 1. Idle reminder warning (8 minutes / 480 sec)
listener {
    timeout = 480
    on-timeout = notify-send -u low -t 10000 "Idle Alert" "Screen will lock in 2 minutes..."
    on-resume = notify-send -u low -t 3000 "Welcome Back" "Activity resumed."
}

# 2. Lock screen (10 minutes / 600 sec)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 3. Turn off monitor / DPMS power save (15 minutes / 900 sec)
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. System Suspend (30 minutes / 1800 sec)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
