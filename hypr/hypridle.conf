# Hypridle — idle, lock, DPMS, and sleep.
# inhibit_sleep=3 holds suspend until hyprlock actually owns the session, so
# the desktop cannot flash (or hang) unlocked during a NVIDIA DRM reset.

general {
    lock_cmd = pidof hyprlock || hyprlock --no-fade-in --grace 0
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = /home/dante/.config/hypr/scripts/after_sleep.sh
    ignore_dbus_inhibit = false
    inhibit_sleep = 3
}

# 1. Idle reminder (8 minutes)
listener {
    timeout = 480
    on-timeout = notify-send -u low -t 10000 "Idle Alert" "Screen will lock in 2 minutes..."
    on-resume = notify-send -u low -t 3000 "Welcome Back" "Activity resumed."
}

# 2. Lock screen (10 minutes)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 3. DPMS off (15 minutes)
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 4. Suspend (30 minutes)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
