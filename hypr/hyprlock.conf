# /* Hyprlock configuration with School of Athens wallpaper */
# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    path = /home/dante/Pictures/Wallpapers/school-of-athens.jpg
    color = rgba(10, 10, 15, 1.0)

    # Blur and color balance
    blur_passes = 2
    blur_size = 4
    noise = 0.0117
    contrast = 1.1000
    brightness = 0.8500
    vibrancy = 0.2000
    vibrancy_darkness = 0.0
}

# Date Label
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B %Y')" </b>"
    color = $color15
    font_size = 24
    font_family = JetBrains Mono Bold
    position = 0, -80
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Clock (Hour:Minute)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $foreground
    font_size = 110
    font_family = JetBrains Mono ExtraBold
    position = 0, -130
    halign = center
    valign = top
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.7)
}

# User Greeting / Icon
label {
    monitor =
    text =   $USER
    color = $color14
    font_size = 20
    font_family = JetBrains Mono Bold
    position = 0, 150
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Input Field (Password)
input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    outer_color = $color2
    inner_color = rgba(20, 20, 30, 0.65)
    font_color = $foreground
    capslock_color = $color3
    check_color = $color6
    fail_color = $color4

    fade_on_empty = false
    font_family = JetBrains Mono Bold
    placeholder_text = <i><span foreground="##ffffff88">Enter Password...</span></i>
    hide_input = false
    rounding = 14

    position = 0, 80
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Keyboard Layout Indicator
label {
    monitor =
    text =   $LAYOUT
    color = $color7
    font_size = 13
    font_family = JetBrains Mono Medium
    position = 0, 35
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.4)
}
