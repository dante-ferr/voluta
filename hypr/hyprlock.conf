# Hyprlock — Imperium lock, tuned for Raphael's School of Athens.
# The fresco is high-key cream marble; wallust browns disappear into it, so
# the chrome is hardcoded ivory on basalt slabs rather than the live palette.

# Ivory / imperial gold / basalt — same stones as waybar.
$ivory = rgba(244, 237, 228, 1.0)
$muted = rgba(196, 184, 170, 1.0)
$gold = rgba(201, 162, 39, 1.0)
$basalt = rgba(10, 10, 14, 0.92)
$hairline = rgba(42, 42, 56, 1.0)
$fail = rgba(122, 0, 22, 1.0)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    # Auto fractional scaling has hung the NVIDIA EGL context after resume.
    fractional_scaling = 1
    text_trim = true
}

# Fade-in is the usual NVIDIA hang: hyprlock animates while the DRM node is
# still coming back from suspend. Keep the lock instant and silent.
animations {
    enabled = false
}

background {
    monitor =
    path = $HOME/.config/hypr/assets/school-of-athens.jpg
    color = rgba(10, 10, 14, 1.0)

    blur_passes = 3
    blur_size = 6
    noise = 0.012
    contrast = 0.95
    brightness = 0.52
    vibrancy = 0.12
    vibrancy_darkness = 0.35
}

# Veil over the fresco so the lettering does not compete with the marble.
shape {
    monitor =
    size = 100%, 100%
    color = rgba(8, 7, 6, 0.45)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# Clock tablet
shape {
    monitor =
    size = 560, 210
    color = $basalt
    rounding = 0
    border_size = 1
    border_color = $hairline
    position = 0, -100
    halign = center
    valign = top
    zindex = 1
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.65)
}

label {
    monitor =
    text = cmd[update:18000000] echo "<b>$(date +'%A, %-d %B %Y')</b>"
    color = $muted
    font_size = 18
    font_family = Cinzel
    position = 0, -118
    halign = center
    valign = top
    zindex = 2
}

label {
    monitor =
    text = $TIME
    color = $ivory
    font_size = 96
    font_family = JetBrains Mono ExtraBold
    position = 0, -148
    halign = center
    valign = top
    zindex = 2
}

# Password tablet
shape {
    monitor =
    size = 420, 200
    color = $basalt
    rounding = 0
    border_size = 1
    border_color = $hairline
    position = 0, 70
    halign = center
    valign = bottom
    zindex = 1
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.65)
}

label {
    monitor =
    text = $USER
    color = $gold
    font_size = 16
    font_family = Cinzel
    position = 0, 210
    halign = center
    valign = bottom
    zindex = 2
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = 0

    outer_color = $gold
    inner_color = rgba(10, 10, 14, 1.0)
    font_color = $ivory
    capslock_color = $gold
    check_color = $gold
    fail_color = $fail
    fail_text = <i><span foreground="##F4EDE4">$FAIL</span></i>
    placeholder_text = <i><span foreground="##C4B8AA">Password</span></i>

    fade_on_empty = false
    font_family = JetBrains Mono Bold
    hide_input = false
    rounding = 0

    position = 0, 130
    halign = center
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = $LAYOUT
    color = $muted
    font_size = 12
    font_family = JetBrains Mono Medium
    position = 0, 88
    halign = center
    valign = bottom
    zindex = 2
}
