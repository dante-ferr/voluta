# Imperium — an open, two-line cartouche.
# ANSI indices inherit the live Wallust palette, including existing scrollback.
# After editing, run tools/gen-starship-template.py to sync the optional template.

add_newline = true
command_timeout = 5000
continuation_prompt = "[│](fg:8) [· ](fg:3)"

format = """
[╭─](fg:8)[ ❦ ](fg:3)\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$conda\
$python\
$nodejs\
$rust\
$golang\
$lua\
$c\
$fill\
$cmd_duration\
$time\
$line_break\
[╰─](fg:8)$character"""

# Space keeps the context and clock apart without a rule across the window.
[fill]
symbol = " "

[character]
success_symbol = "[❯](bold fg:1)"
error_symbol = "[× ❯](bold fg:9)"
vimcmd_symbol = "[◆](bold fg:3)"

[username]
show_always = false
style_user = "fg:7"
style_root = "bold fg:9"
format = "[$user]($style) [·](fg:8) "

[hostname]
ssh_only = true
style = "fg:7"
format = "[$hostname]($style) [·](fg:8) "

[directory]
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "fg:3"
style = "bold fg:15"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
truncation_length = 24
style = "fg:1"
format = "[·](fg:8) [$symbol $branch]($style) "

[git_status]
style = "fg:3"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "×${count} "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↑${ahead_count} ↓${behind_count} "
untracked = "?${count} "
modified = "~${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "−${count} "
stashed = "≡${count} "

[git_state]
style = "bold fg:9"
format = '[$state( $progress_current/$progress_total)]($style) '

[cmd_duration]
min_time = 2000
style = "fg:3"
format = "[$duration]($style) [·](fg:8) "

[time]
disabled = false
time_format = "%H:%M"
style = "fg:8"
format = "[$time]($style)"

[package]
disabled = true

[conda]
symbol = "󰆧"
style = "fg:2"
format = "[·](fg:8) [$symbol $environment]($style) "

[python]
symbol = ""
style = "fg:2"
format = "[·](fg:8) [$symbol $version( $virtualenv)]($style) "

[nodejs]
symbol = ""
style = "fg:2"
format = "[·](fg:8) [$symbol $version]($style) "

[rust]
symbol = ""
style = "fg:2"
format = "[·](fg:8) [$symbol $version]($style) "

[golang]
symbol = ""
style = "fg:2"
format = "[·](fg:8) [$symbol $version]($style) "

[lua]
symbol = ""
style = "fg:2"
format = "[·](fg:8) [$symbol $version]($style) "

[c]
symbol = ""
style = "fg:2"
format = "[·](fg:8) [$symbol $version]($style) "
