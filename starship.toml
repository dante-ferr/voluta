# /* wallust template - colors-starship */
# Starship Prompt - Dynamic Wallust Palette (Roman Imperium Cyber-Sacred Rice)
#
# NOTE: the separators/icons are Nerd Font glyphs, several of them in the
# private use area. Editors that strip those codepoints will silently gut the
# powerline caps, so regenerate this file rather than retyping the symbols.

add_newline = true
command_timeout = 5000
continuation_prompt = "[▸▸ ](bold fg:#634C36)"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$conda\
$python\
$nodejs\
$rust\
$golang\
$lua\
$c\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

# Rule joining the left insignia to the right chronometer
[fill]
symbol = "─"
style = "fg:#4A3A34"

# Prompt Symbols
[character]
success_symbol = "[ SPQR](bold fg:#9A684B)[ ❯](bold fg:#B4ADAB)"
error_symbol = "[󰞇 SPQR](bold fg:#B4ADAB)[ ❯](bold fg:#9A684B)"
vimcmd_symbol = "[󰊠 SPQR](bold fg:#796C68)[ ❯](bold fg:#B4ADAB)"

# User & Host
[username]
show_always = false
style_user = "bold fg:#040402 bg:#774F3B"
style_root = "bold fg:#B4ADAB bg:#774F3B"
format = "[](fg:#774F3B)[ 󰀘 $user ]($style)[](fg:#774F3B) "
disabled = false

[hostname]
ssh_only = true
style = "bold fg:#040402 bg:#774F3B"
format = "[](fg:#774F3B)[ 󰒋 $hostname ]($style)[](fg:#774F3B) "
disabled = false

# Directory / Arx
[directory]
truncation_length = 4
truncation_symbol = "…/"
home_symbol = " ~"
read_only = "󰌾 "
read_only_style = "bold fg:#040402 bg:#9A684B"
style = "bold fg:#040402 bg:#9A684B"
format = "[](fg:#9A684B)[ $path ]($style)[$read_only]($read_only_style)[](fg:#9A684B) "

[directory.substitutions]
"Desktop" = " Desktop"
"Documents" = " Documents"
"Downloads" = " Downloads"
"Music" = " Music"
"Pictures" = " Pictures"
"Videos" = " Videos"

# Git Branch / Cohors
[git_branch]
symbol = ""
style = "bold fg:#B4ADAB bg:#634C36"
format = "[](fg:#634C36)[ $symbol $branch ]($style)"

# Git Status / Tactical Military & Archival Indicators
# The closing cap lives here so the branch pill stays sealed on clean trees.
[git_status]
style = "bold fg:#9A684B bg:#634C36"
format = '([](fg:#796C68 bg:#634C36)[ $all_status$ahead_behind]($style))[](fg:#634C36) '
conflicted = " ${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count} ⇣${behind_count} "
untracked = "◈ ${count} "
modified = " ${count} "
staged = " ${count} "
renamed = "» ${count} "
deleted = " ${count} "
stashed = " ${count} "

[git_state]
style = "bold fg:#040402 bg:#88643F"
format = '[](fg:#88643F)[ $state( $progress_current/$progress_total) ]($style)[](fg:#88643F) '

# Command Duration / Celeritas
[cmd_duration]
min_time = 2000
style = "bold fg:#040402 bg:#774F3B"
format = "[](fg:#774F3B)[ 󰔟 $duration ]($style)[](fg:#774F3B) "

# Chronometer / Horologium
[time]
disabled = false
time_format = "%H:%M"
style = "bold fg:#B4ADAB bg:#4A3A34"
format = "[](fg:#4A3A34)[ 󰥔 $time ]($style)[](fg:#4A3A34)"

# Package / Languages
[package]
disabled = true

[conda]
symbol = "󰆧"
style = "bold fg:#9A684B"
format = "[$symbol]($style)[ $environment ](fg:#796C68) "

[lua]
symbol = ""
style = "bold fg:#9A684B"
format = "[$symbol]($style)[ $version ](fg:#796C68) "

[python]
symbol = ""
style = "bold fg:#9A684B"
format = "[$symbol]($style)[ $version ](fg:#796C68) "

[nodejs]
symbol = ""
style = "bold fg:#9A684B"
format = "[$symbol]($style)[ $version ](fg:#796C68) "

[golang]
symbol = ""
style = "bold fg:#9A684B"
format = "[$symbol]($style)[ $version ](fg:#796C68) "

[rust]
symbol = ""
style = "bold fg:#9A684B"
format = "[$symbol]($style)[ $version ](fg:#796C68) "

[c]
symbol = ""
style = "bold fg:#9A684B"
format = "[$symbol]($style)[ $version ](fg:#796C68) "
