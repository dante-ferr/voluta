[Settings]
language = en
backend = awww
folder = ~/Pictures/Wallpapers
# wallpaper + monitors live in ~/.local/state/waypaper/state.ini when
# use_xdg_state is True, so selecting wallpapers does not dirty this rice file.
show_path_in_tooltip = True
fill = fill
sort = name
color = #ffffff
subfolders = True
all_subfolders = True
show_hidden = False
show_gifs_only = False
zen_mode = False
# Runs after every wallpaper set. combined_wallust.sh is flock-serialized so a
# multi-monitor restore cannot spawn one waybar per display. Startup uses
# --no-post-command and calls combined_wallust once instead.
post_command = ~/.config/hypr/UserScripts/combined_wallust.sh "$wallpaper"
number_of_columns = 3
swww_transition_type = any
swww_transition_step = 63
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
mpvpaper_sound = False
mpvpaper_options =
use_xdg_state = True
# Defaults under ~/.config/waypaper. An empty value becomes Path(".") and
# crashes the GUI with IsADirectoryError when loading keybindings.
stylesheet = ~/.config/waypaper/style.css
keybindings = ~/.config/waypaper/keybindings.ini
wallpaperengine_folder = ~/.steam/root/steamapps/workshop/content/431960
linux_wallpaperengine_clamp = none
linux_wallpaperengine_volume = 15
linux_wallpaperengine_silent = False
linux_wallpaperengine_noautomute = False
linux_wallpaperengine_no_audio_processing = False
linux_wallpaperengine_fps = 30
linux_wallpaperengine_disable_particles = True
linux_wallpaperengine_disable_mouse = False
linux_wallpaperengine_disable_parallax = False
linux_wallpaperengine_no_fullscreen_pause = False
waypaperd_cycle_length = 1800
slideshow_interval = 60
slideshow_enabled = False
show_slideshow_panel = False
swww_filter = Lanczos3
